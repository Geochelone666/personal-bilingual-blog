name: Sync Worker secrets (manual)
on:
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Put secrets into pbb-writer
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: fd879cce8bb27887c8539b8aef1fb741
          V_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          V_DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          V_GITHUB_TOKEN: ${{ secrets.PBB_GITHUB_TOKEN }}
          V_CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          V_DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          V_BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: |
          set -euo pipefail
          for n in TELEGRAM_BOT_TOKEN DEEPL_API_KEY GITHUB_TOKEN CF_API_TOKEN; do
            v="V_$n"
            if [ -z "${!v}" ]; then echo "missing $n"; exit 1; fi
            printf %s "${!v}" | npx -y wrangler@4 secret put "$n" --name pbb-writer
          done
          # optional cross-posting secrets: synced only when present
          for n in DEVTO_API_KEY BLUESKY_APP_PASSWORD; do
            v="V_$n"
            if [ -n "${!v}" ]; then printf %s "${!v}" | npx -y wrangler@4 secret put "$n" --name pbb-writer; fi
          done
          npx -y wrangler@4 secret list --name pbb-writer | jq -r '.[].name'
