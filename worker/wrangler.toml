name = "pbb-writer"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

# Publishing state machine is advanced every minute (free plan allows cron triggers).
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "pbb"
database_id = "12f69985-d737-4f23-b17c-401ef58665d6"
migrations_dir = "migrations"

[vars]
ALLOWED_TELEGRAM_USER_IDS = "7704621098"
GITHUB_REPO = "Geochelone666/personal-bilingual-blog"
GITHUB_BRANCH = "main"            # production (approved by user 2026-11-04)
PUBLISH_MODE = "production"        # "preview" | "production"
CF_ACCOUNT_ID = "fd879cce8bb27887c8539b8aef1fb741"
PAGES_PROJECT = "personal-bilingual-blog"
SITE_URL = "https://personal-bilingual-blog.pages.dev"
WORKER_URL = "https://pbb-writer.geochelone666.workers.dev"
DEEPL_MIN_REMAINING = "2000"
AUTO_PUBLISH = "true"              # user: "我发了你就给我搞就行" (2026-11-04)
ENABLED_PLATFORMS = "blog,telegram,devto,bluesky"  # each also needs its credentials
TELEGRAM_CHANNEL = "@inkward_blog"
BLUESKY_HANDLE = "yanzhou05.bsky.social"

# Secrets (never committed):
#   TELEGRAM_BOT_TOKEN TELEGRAM_WEBHOOK_SECRET DEEPL_API_KEY GITHUB_TOKEN
#   CF_API_TOKEN PREVIEW_SIGNING_KEY ADMIN_TOKEN

[ai]
binding = "AI"
